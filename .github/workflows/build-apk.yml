name: Build Saferr Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make Gradle executable
      run: chmod +x child-android/gradlew

    - name: Build Debug APK
      run: |
        cd child-android
        ./gradlew assembleDebug --no-daemon

    - name: Rename APK to saferr.apk
      run: cp child-android/app/build/outputs/apk/debug/app-debug.apk child-android/app/build/outputs/apk/debug/saferr.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: saferr.apk
        path: child-android/app/build/outputs/apk/debug/saferr.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "Saferr Child Safety App v1.0.0"
        body: "Production APK for Saferr Child Safety monitoring platform."
        files: child-android/app/build/outputs/apk/debug/saferr.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
